<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verificação 2FA — GB & N.Comin Advocacia</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body{background:#0d1117;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:48px 40px;width:100%;max-width:400px;}
.brand{text-align:center;margin-bottom:32px;}
.brand h1{font-size:1.6rem;font-weight:800;color:#e6edf3;}
.brand h1 span{color:#e8650a;}
.brand p{color:#8b949e;font-size:.9rem;margin-top:6px;}
.shield-icon{font-size:3rem;color:#6e40c9;display:block;text-align:center;margin-bottom:16px;}
.form-label{color:#8b949e;font-size:.85rem;font-weight:500;}
.form-control{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:10px;padding:14px 16px;font-size:1.4rem;text-align:center;letter-spacing:.5rem;}
.form-control:focus{background:#21262d;color:#e6edf3;border-color:#6e40c9;box-shadow:0 0 0 3px rgba(110,64,201,.2);}
.btn-verify{background:#6e40c9;color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:1rem;width:100%;}
.btn-verify:hover{opacity:.88;}
.alert{border-radius:10px;background:rgba(218,54,51,.15);border:1px solid rgba(218,54,51,.3);color:#f85149;}
.back-link{text-align:center;margin-top:16px;}
.back-link a{color:#8b949e;font-size:.85rem;text-decoration:none;}
.back-link a:hover{color:#e6edf3;}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <i class="fas fa-shield-alt shield-icon"></i>
    <h1><span>GB</span> & N.Comin</h1>
    <p>Autenticação em Dois Fatores</p>
  </div>
  <div style="text-align:center;color:#8b949e;font-size:.9rem;margin-bottom:24px;">
    Olá, <strong style="color:#e6edf3;">{{ username }}</strong><br>
    Digite o código de 6 dígitos do seu app autenticador.
  </div>
  {% if messages %}{% for msg in messages %}
  <div class="alert mb-3"><i class="fas fa-exclamation-circle me-2"></i>{{ msg }}</div>
  {% endfor %}{% endif %}
  <form method="post" autocomplete="off">
    {% csrf_token %}
    <div class="mb-4">
      <label class="form-label d-block text-center mb-2">Código de Verificação</label>
      <input type="text" name="token" class="form-control" placeholder="000000"
             maxlength="6" inputmode="numeric" pattern="[0-9]*" autofocus required>
    </div>
    <button type="submit" class="btn-verify"><i class="fas fa-check me-2"></i>Verificar</button>
  </form>
  <div class="back-link">
    <a href="{% url 'accounts:logout' %}"><i class="fas fa-arrow-left me-1"></i>Sair e voltar ao login</a>
  </div>
</div>
</body>
</html>
