<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GB & N.Comin Advocacia</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
  body { background: #0d1117; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
  .login-card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 420px; }
  .brand { text-align: center; margin-bottom: 36px; }
  .brand h1 { font-size: 1.8rem; font-weight: 800; color: #e6edf3; }
  .brand h1 span { color: #e8650a; }
  .brand p { color: #8b949e; font-size: .9rem; margin-top: 6px; }
  .form-label { color: #8b949e; font-size: .85rem; font-weight: 500; }
  .form-control { background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 10px; padding: 12px 16px; }
  .form-control:focus { background: #21262d; color: #e6edf3; border-color: #e8650a; box-shadow: 0 0 0 3px rgba(232,101,10,.15); }
  .form-control::placeholder { color: #484f58; }
  .btn-login { background: #e8650a; color: #fff; border: none; border-radius: 10px; padding: 13px; font-weight: 700; font-size: 1rem; width: 100%; transition: opacity .2s; }
  .btn-login:hover { opacity: .88; }
  .alert { border-radius: 10px; background: rgba(218,54,51,.15); border: 1px solid rgba(218,54,51,.3); color: #f85149; }
  .input-group-text { background: #21262d; border: 1px solid #30363d; color: #8b949e; border-radius: 0 10px 10px 0; }
  .input-icon { background: #21262d; border: 1px solid #30363d; border-right: none; color: #8b949e; border-radius: 10px 0 0 10px; padding: 0 14px; display: flex; align-items: center; }
  .input-with-icon { display: flex; }
  .input-with-icon .form-control { border-radius: 0 10px 10px 0; border-left: none; }
  .input-with-icon .form-control:focus { border-left: none; }
  .divider { border-top: 1px solid #30363d; margin: 24px 0; }
  .hint { text-align: center; color: #8b949e; font-size: .8rem; }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <h1><span>GB</span> & N.Comin</h1>
    <h2 style="font-size:1rem;color:#8b949e;font-weight:400;">Advocacia</h2>
    <p>Sistema de Gestão Jurídica</p>
  </div>
  {% if messages %}
    {% for message in messages %}
    <div class="alert mb-3"><i class="fas fa-exclamation-circle me-2"></i>{{ message }}</div>
    {% endfor %}
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="form-label">Usuário</label>
      <div class="input-with-icon">
        <div class="input-icon"><i class="fas fa-user"></i></div>
        <input type="text" name="username" class="form-control" placeholder="Digite seu usuário" required autofocus>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">Senha</label>
      <div class="input-with-icon">
        <div class="input-icon"><i class="fas fa-lock"></i></div>
        <input type="password" name="password" id="password" class="form-control" placeholder="Digite sua senha" required>
      </div>
    </div>
    <button type="submit" class="btn-login mt-2">
      <i class="fas fa-sign-in-alt me-2"></i>Entrar
    </button>
  </form>
  <div class="divider"></div>
  <div class="hint">
    <i class="fas fa-shield-alt me-1" style="color:#e8650a"></i>
    Sistema protegido — Acesso restrito
  </div>
</div>
</body>
</html>
