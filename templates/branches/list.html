{% extends 'base.html' %}
{% block title %}Filiais{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title"><i class="fas fa-building" style="color:var(--accent-orange)"></i>Filiais</div>
</div>
<div class="section-box p-0">
  <table class="data-table">
    <thead><tr><th>Nome</th><th>Cidade/Estado</th><th>Telefone</th><th>Admin</th><th>Status</th></tr></thead>
    <tbody>
      {% for b in branches %}
      <tr>
        <td style="font-weight:700;">{{ b.name }}</td>
        <td>{{ b.city }}/{{ b.state }}</td>
        <td>{{ b.phone }}</td>
        <td>{{ b.admin_name }}</td>
        <td><span class="badge-status {% if b.is_active %}badge-success{% else %}badge-secondary{% endif %}">{{ b.is_active|yesno:"Ativa,Inativa" }}</span></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
