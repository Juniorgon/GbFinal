version: '3.9'

# ============================================================
# GB & N.Comin Advocacia — Docker Compose (DESENVOLVIMENTO)
# Branch: develop | Versão: 1.1.0-dev
# Para produção use: docker-compose.prod.yml
# ============================================================

services:
  db:
    image: postgres:15-alpine
    container_name: advocacia_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME:-advocacia_db}
      POSTGRES_USER: ${DB_USER:-advocacia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-advocacia_pass123}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-advocacia_user} -d ${DB_NAME:-advocacia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: advocacia_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: advocacia_web
    restart: unless-stopped
    volumes:
      - .:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - SYSTEM_ENV=development
      - SYSTEM_VERSION=1.1.0-dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py create_initial_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --reload"

  nginx:
    image: nginx:alpine
    container_name: advocacia_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
