version: '3.9'

# ============================================================
# GB & N.Comin Advocacia — Docker Compose (PRODUÇÃO)
# Branch: main | Versão: 1.0.0
# ============================================================

services:
  db:
    image: postgres:15-alpine
    container_name: advocacia_db_prod
    restart: always
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: advocacia_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: advocacia_web_prod
    restart: always
    volumes:
      - media_files_prod:/app/media
      - static_files_prod:/app/staticfiles
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SYSTEM_ENV=production
      - SYSTEM_VERSION=1.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"

  nginx:
    image: nginx:alpine
    container_name: advocacia_nginx_prod
    restart: always
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - static_files_prod:/app/staticfiles
      - media_files_prod:/app/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  postgres_data_prod:
  redis_data_prod:
  media_files_prod:
  static_files_prod:
